# OpenSSF Scorecard: continuously scores this repo's own supply-chain posture
# (branch protection, pinned dependencies, token permissions, code scanning, ...)
# and publishes the result so the README badge and the OpenSSF report stay live.
# A security tool should be measurably hardened itself; this is that measurement.
name: OSSF Scorecard

on:
  # Re-scan when branch protection changes (a Scorecard signal), weekly, and on
  # pushes to the default branch so the score reflects the current tree.
  branch_protection_rule:
  schedule:
    - cron: "27 6 * * 1"
  push:
    branches: [main]

# Least privilege by default; the job below elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to the Security tab (code scanning).
      security-events: write
      # Needed by publish_results to attest the run to the OpenSSF API.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish so the public OpenSSF report and the README badge resolve.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
